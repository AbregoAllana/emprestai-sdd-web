name: Checks do frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- src/generated
      - run: npm run build
      - run: npm run lint
      - run: npm test
